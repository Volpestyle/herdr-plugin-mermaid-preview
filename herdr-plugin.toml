id = "dev.volpestyle.mermaid-preview"
name = "Herdr Preview"
version = "0.3.0"
min_herdr_version = "0.7.1"
description = "Render Mermaid diagrams and transcript images from Claude Code and Codex in a live Herdr preview pane"
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[actions]]
id = "open"
title = "Open Mermaid preview"
contexts = ["pane"]
command = ["node", "src/open-preview.mjs", "mermaid"]

[[actions]]
id = "open-images"
title = "Open image preview"
contexts = ["pane"]
command = ["node", "src/open-preview.mjs", "images"]

[[panes]]
id = "preview"
title = "Preview"
placement = "tab"
command = ["node", "src/preview.mjs"]
